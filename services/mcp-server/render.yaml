services:
  - type: web
    name: mcp-server
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    region: oregon
    branch: M8
    healthCheckPath: /health
    envVars:
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_PORT
        value: 8001
      - key: MCP_AUTH_REQUIRED
        value: false
      - key: MCP_DEBUG
        value: false
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_OPTIONAL
        value: true
      # Database credentials - you'll need to add these in Render dashboard
      - key: DB_HOST
        sync: false  # Set manually in Render dashboard for security
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
    autoDeploy: true