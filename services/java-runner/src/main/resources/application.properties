server.port=8080
spring.application.name=java-runner

# Unified API configuration
app.unified-api.url=${UNIFIED_API_URL:http://localhost:8000}

# Spring Boot Actuator configuration for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# Logging configuration
logging.level.demo=DEBUG
logging.level.org.springframework=INFO
logging.level.org.openqa.selenium=INFO

# Thread pool configuration for test execution
app.execution.max-concurrent-runs=10
app.execution.thread-pool-size=10
app.execution.queue-capacity=100

# WebDriver configuration
app.webdriver.headless=true
app.webdriver.timeout=30
app.webdriver.implicit-wait=10