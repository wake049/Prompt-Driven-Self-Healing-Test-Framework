# Standalone mode configuration
# Used when running as a desktop .exe or portable JAR (no Docker)
# Activate with: --spring.profiles.active=standalone

server.port=${SERVER_PORT:8080}
spring.application.name=self-healing-test-runner

# Unified API - where the backend API is running
app.unified-api.url=${UNIFIED_API_URL:http://localhost:8000}

# WebDriver - uses local browsers via WebDriverManager (auto-downloads drivers)
app.webdriver.headless=${HEADLESS:false}
app.webdriver.timeout=30
app.webdriver.implicit-wait=10

# Execution
app.execution.max-concurrent-runs=5
app.execution.thread-pool-size=5
app.execution.queue-capacity=50

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging - file output for standalone mode
logging.level.demo=INFO
logging.level.org.springframework=WARN
logging.level.org.openqa.selenium=WARN
logging.file.name=${LOG_DIR:./logs}/test-runner.log
logging.file.max-size=10MB
logging.file.max-history=5
