# Agent mode configuration
# Activate with: java -jar runner.jar --spring.profiles.active=agent
# Or set env: SPRING_PROFILES_ACTIVE=agent

server.port=${SERVER_PORT:8080}
spring.application.name=self-healing-runner-agent

# --- Runner Agent Settings ---
# API URL: where your Unified API is hosted
runner.api-url=${RUNNER_API_URL:http://localhost:8000}

# Organization ID: your org UUID from the platform (required for first registration)
runner.organization-id=${RUNNER_ORG_ID:}

# Runner name: friendly name shown in dashboard (auto-generated from hostname if blank)
runner.name=${RUNNER_NAME:}

# API key: required if RUNNER_API_KEY is set on the server
runner.api-key=${RUNNER_API_KEY:}

# Browser capabilities this runner supports (comma-separated)
runner.capabilities=${RUNNER_CAPABILITIES:chrome}

# --- Appium Auto-Management ---
# Appium server URL (default: localhost:4723)
runner.appium-server-url=${RUNNER_APPIUM_URL:http://localhost:4723}

# Auto-start Appium server when appium-* capabilities are configured (true/false)
runner.appium-auto-start=${RUNNER_APPIUM_AUTO_START:true}

# Max seconds to wait for Appium to start
runner.appium-startup-timeout-seconds=${RUNNER_APPIUM_TIMEOUT:120}

# How often to check for new work (milliseconds)
runner.poll-interval-ms=${RUNNER_POLL_INTERVAL:15000}

# How often to send heartbeat (milliseconds)
runner.heartbeat-interval-ms=${RUNNER_HEARTBEAT_INTERVAL:30000}

# File to persist runner credentials across restarts
runner.credentials-file=${RUNNER_CREDENTIALS_FILE:runner-credentials.properties}

# --- WebDriver (uses local browsers via WebDriverManager) ---
app.unified-api.url=${RUNNER_API_URL:http://localhost:8000}
app.webdriver.headless=${HEADLESS:false}
app.webdriver.timeout=30
app.webdriver.implicit-wait=10

# --- Execution ---
app.execution.max-concurrent-runs=5
app.execution.thread-pool-size=5
app.execution.queue-capacity=50

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- Logging ---
logging.level.demo=INFO
logging.level.demo.RunnerAgent=DEBUG
logging.level.org.springframework=WARN
logging.level.org.openqa.selenium=WARN
logging.file.name=${LOG_DIR:./logs}/runner-agent.log
logging.file.max-size=10MB
logging.file.max-history=5
