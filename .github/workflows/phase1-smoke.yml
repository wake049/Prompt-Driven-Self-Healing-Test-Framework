name: phase1-smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install smoke dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests websockets

      - name: Start local stack
        run: |
          docker compose -f docker-compose.local.yml up -d --build

      - name: Wait for unified API health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "Unified API is healthy"
              exit 0
            fi
            echo "Waiting for unified API... ($i/60)"
            sleep 5
          done
          echo "Unified API failed to become healthy in time"
          docker compose -f docker-compose.local.yml logs --tail=200
          exit 1

      - name: Wait for MCP health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8001/mcp/health > /dev/null; then
              echo "MCP server is healthy"
              exit 0
            fi
            echo "Waiting for MCP server... ($i/60)"
            sleep 5
          done
          echo "MCP server failed to become healthy in time"
          docker compose -f docker-compose.local.yml logs --tail=200
          exit 1

      - name: Run phase 1 smoke test
        env:
          SMOKE_BASE_URL: http://localhost:8000
          SMOKE_MCP_URL: ws://localhost:8001/mcp/ws
        run: |
          python tests/smoke_release_phase1.py

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.local.yml logs --tail=300

      - name: Tear down stack
        if: always()
        run: |
          docker compose -f docker-compose.local.yml down -v
