name: phase5-ga-launch

on:
  workflow_dispatch:
  schedule:
    # Daily at 06:00 UTC during GA week
    - cron: '0 6 * * *'

jobs:
  # -----------------------------------------------------------
  # Job 1: Daily monitoring (runs every trigger)
  # -----------------------------------------------------------
  daily-monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Start local stack
        run: |
          docker compose -f docker-compose.local.yml up -d --build

      - name: Wait for unified API
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "Unified API healthy"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done
          echo "Unified API not healthy"
          docker compose -f docker-compose.local.yml logs unified-api --tail=100
          exit 1

      - name: Wait for MCP server
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8001/mcp/health > /dev/null; then
              echo "MCP server healthy"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done
          echo "MCP server not healthy"
          docker compose -f docker-compose.local.yml logs mcp-server --tail=100
          exit 1

      - name: Run daily monitoring
        run: python tests/test_daily_monitoring.py

      - name: Upload monitoring report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-daily-monitoring-${{ github.run_number }}
          path: phase5_daily_monitoring_report.json

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.local.yml down -v

  # -----------------------------------------------------------
  # Job 2: Pilot tenant rollout validation
  # -----------------------------------------------------------
  pilot-rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Start local stack
        run: |
          docker compose -f docker-compose.local.yml up -d --build

      - name: Wait for unified API
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "Unified API healthy"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done
          echo "Unified API not healthy"
          docker compose -f docker-compose.local.yml logs unified-api --tail=100
          exit 1

      - name: Wait for MCP server
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8001/mcp/health > /dev/null; then
              echo "MCP server healthy"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done
          echo "MCP server not healthy"
          docker compose -f docker-compose.local.yml logs mcp-server --tail=100
          exit 1

      - name: Run pilot rollout validation
        run: python tests/test_pilot_rollout.py

      - name: Upload pilot rollout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-pilot-rollout-report
          path: phase5_pilot_rollout_report.json

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.local.yml down -v

  # -----------------------------------------------------------
  # Job 3: Production stability tracker
  # -----------------------------------------------------------
  stability-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Start local stack
        run: |
          docker compose -f docker-compose.local.yml up -d --build

      - name: Wait for unified API
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "Unified API healthy"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done
          echo "Unified API not healthy"
          docker compose -f docker-compose.local.yml logs unified-api --tail=100
          exit 1

      - name: Wait for MCP server
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8001/mcp/health > /dev/null; then
              echo "MCP server healthy"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done
          echo "MCP server not healthy"
          docker compose -f docker-compose.local.yml logs mcp-server --tail=100
          exit 1

      - name: Run stability tracker
        run: python tests/test_production_stability.py

      - name: Upload stability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-stability-report-${{ github.run_number }}
          path: |
            phase5_stability_report.json
            phase5_stability_log.json

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.local.yml down -v
