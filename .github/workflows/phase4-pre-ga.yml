name: phase4-pre-ga

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]

jobs:
  # -----------------------------------------------------------
  # Job 1: Operational monitoring validation
  # -----------------------------------------------------------
  monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Start local stack
        run: |
          docker compose -f docker-compose.local.yml up -d --build

      - name: Wait for unified API
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "Unified API healthy"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done
          echo "Unified API not healthy"
          docker compose -f docker-compose.local.yml logs unified-api --tail=100
          exit 1

      - name: Wait for MCP server
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8001/mcp/health > /dev/null; then
              echo "MCP server healthy"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done
          echo "MCP server not healthy"
          docker compose -f docker-compose.local.yml logs mcp-server --tail=100
          exit 1

      - name: Run operational monitoring checks
        run: python tests/test_operational_monitoring.py

      - name: Upload monitoring report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-monitoring-report
          path: phase4_monitoring_report.json

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.local.yml down -v

  # -----------------------------------------------------------
  # Job 2: Incident playbook validation
  # -----------------------------------------------------------
  incident-playbooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Start local stack
        run: |
          docker compose -f docker-compose.local.yml up -d --build

      - name: Wait for unified API
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "Unified API healthy"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done
          echo "Unified API not healthy"
          docker compose -f docker-compose.local.yml logs unified-api --tail=100
          exit 1

      - name: Run incident playbooks
        run: python tests/test_incident_playbooks.py

      - name: Upload playbook report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-incident-playbook-report
          path: phase4_incident_playbook_report.json

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.local.yml down -v

  # -----------------------------------------------------------
  # Job 3: GA launch checklist (file-level + live)
  # -----------------------------------------------------------
  launch-checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Start local stack
        run: |
          docker compose -f docker-compose.local.yml up -d --build

      - name: Wait for unified API
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "Unified API healthy"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done
          echo "Unified API not healthy"
          docker compose -f docker-compose.local.yml logs unified-api --tail=100
          exit 1

      - name: Run GA launch checklist
        run: python tests/test_ga_launch_checklist.py

      - name: Upload checklist report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-launch-checklist-report
          path: phase4_launch_checklist_report.json

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.local.yml down -v

  # -----------------------------------------------------------
  # Job 4: Rollback drill (Docker Compose stop/start cycle)
  # -----------------------------------------------------------
  rollback-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Start local stack
        run: |
          docker compose -f docker-compose.local.yml up -d --build

      - name: Wait for unified API
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "Unified API healthy"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done
          echo "Unified API not healthy"
          docker compose -f docker-compose.local.yml logs unified-api --tail=100
          exit 1

      - name: Run rollback drill
        run: python tests/test_rollback_drill.py

      - name: Upload rollback report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-rollback-drill-report
          path: phase4_rollback_drill_report.json

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.local.yml down -v

  # -----------------------------------------------------------
  # Job 5: Backup/restore drill (requires pg_dump)
  # -----------------------------------------------------------
  backup-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Start local stack
        run: |
          docker compose -f docker-compose.local.yml up -d --build

      - name: Wait for unified API
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "Unified API healthy"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done
          echo "Unified API not healthy"
          docker compose -f docker-compose.local.yml logs unified-api --tail=100
          exit 1

      - name: Wait for database
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Database ready"
              exit 0
            fi
            echo "Waiting for DB... ($i/30)"
            sleep 3
          done
          echo "Database not ready"
          exit 1

      - name: Run backup/restore drill
        run: python tests/test_backup_restore_drill.py

      - name: Upload backup drill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-backup-drill-report
          path: phase4_backup_drill_report.json

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.local.yml down -v
