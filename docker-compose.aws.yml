version: '3.8'

services:
  unified-api:
    build:
      context: services/unified-api
      dockerfile: Dockerfile
    container_name: unified-api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AI_SERVICE_URL=http://localhost:8000
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # AI Configuration defaults (can be overridden via API)
      - OPENAI_ENABLED=${OPENAI_ENABLED:-true}
      - ANTHROPIC_ENABLED=${ANTHROPIC_ENABLED:-false}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: awslogs
      options:
        awslogs-group: ${AWSLOGS_GROUP:-/aws/ecs/self-healing-test-framework}
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-stream-prefix: ${AWSLOGS_STREAM_PREFIX_API:-unified-api}

  mcp-server:
    build:
      context: services/mcp-server
      dockerfile: Dockerfile
    container_name: mcp-server
    ports:
      - "8001:8001"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8001
      - MCP_AUTH_REQUIRED=${MCP_AUTH_REQUIRED:-true}
      - MCP_DEBUG=${MCP_DEBUG:-false}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - MCP_API_KEY=${MCP_API_KEY}
      - UNIFIED_API_URL=${UNIFIED_API_URL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: awslogs
      options:
        awslogs-group: ${AWSLOGS_GROUP:-/aws/ecs/self-healing-test-framework}
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-stream-prefix: ${AWSLOGS_STREAM_PREFIX_MCP:-mcp-server}

  react-frontend:
    build:
      context: services/react-frontend
      dockerfile: Dockerfile
      args:
        - VITE_UNIFIED_API_URL=${VITE_UNIFIED_API_URL}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_SQL_API_URL=${VITE_SQL_API_URL}
        - VITE_AI_API_URL=${VITE_AI_API_URL}
        - VITE_HEALING_API_URL=${VITE_HEALING_API_URL}
        - VITE_POLICY_API_URL=${VITE_POLICY_API_URL}
        - VITE_MCP_SERVER_URL=${VITE_MCP_SERVER_URL}
        - VITE_MCP_AUTH_TOKEN=${VITE_MCP_AUTH_TOKEN:-}
    container_name: react-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL}
      - REACT_APP_MCP_SERVER_URL=${REACT_APP_MCP_SERVER_URL}
      - NODE_ENV=${NODE_ENV:-production}
      - FRONTEND_DOMAIN=${FRONTEND_DOMAIN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: awslogs
      options:
        awslogs-group: ${AWSLOGS_GROUP:-/aws/ecs/self-healing-test-framework}
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-stream-prefix: ${AWSLOGS_STREAM_PREFIX_FRONTEND:-react-frontend}

  java-runner:
    build:
      context: services/java-runner
      dockerfile: Dockerfile
    container_name: java-runner
    ports:
      - "8080:8080"
    environment:
      - API_BASE_URL=${API_BASE_URL}
      - SELENIUM_HEADLESS=${SELENIUM_HEADLESS:-true}
      - DISPLAY=:99
      - ENVIRONMENT=${ENVIRONMENT:-production}
    restart: unless-stopped
    depends_on:
      unified-api:
        condition: service_healthy
    volumes:
      - screenshots-volume:/app/screenshots
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: awslogs
      options:
        awslogs-group: ${AWSLOGS_GROUP:-/aws/ecs/self-healing-test-framework}
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-stream-prefix: ${AWSLOGS_STREAM_PREFIX_RUNNER:-java-runner}

volumes:
  screenshots-volume:
    driver: local

networks:
  default:
    driver: bridge