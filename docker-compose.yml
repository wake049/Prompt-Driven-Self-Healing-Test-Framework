version: '3.8'

services:
  unified-api:
    build:
      context: services/unified-api
      dockerfile: Dockerfile
    container_name: unified-api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=prompt-qa.choawqiq4n3x.us-east-2.rds.amazonaws.com
      - DB_PORT=5432
      - DB_NAME=promptqa
      - DB_USER=prompt_qa_db
      - "DB_PASSWORD=St70698!2#4"
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - AI_SERVICE_URL=http://localhost:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mcp-server:
    build:
      context: services/mcp-server
      dockerfile: Dockerfile
    container_name: mcp-server
    ports:
      - "8001:8001"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8001
      - MCP_AUTH_REQUIRED=false
      - MCP_DEBUG=false
      - ENVIRONMENT=production
      - DB_HOST=prompt-qa.choawqiq4n3x.us-east-2.rds.amazonaws.com
      - DB_PORT=5432
      - DB_NAME=promptqa
      - DB_USER=prompt_qa_db
      - "DB_PASSWORD=St70698!2#4"
      - DATABASE_OPTIONAL=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8001)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  java-runner:
    build:
      context: services/java-runner
      dockerfile: Dockerfile
    container_name: java-runner
    ports:
      - "8080:8080"
    environment:
      - API_BASE_URL=http://unified-api:8000
      - SELENIUM_HEADLESS=true
      - DISPLAY=:99
    restart: unless-stopped
    depends_on:
      - unified-api
    volumes:
      - ./services/java-runner/screenshots:/app/screenshots
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  react-frontend:
    build:
      context: services/react-frontend
      dockerfile: Dockerfile
    container_name: react-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:8000
      - REACT_APP_MCP_SERVER_URL=ws://localhost:8001
    restart: unless-stopped
    depends_on:
      - unified-api
      - mcp-server

volumes:
  # No local database volume needed since using AWS RDS