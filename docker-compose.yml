version: '3.8'

services:
  unified-api:
    build:
      context: services/unified-api
      dockerfile: Dockerfile
    container_name: unified-api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # Ollama configuration (for local LLM inference)
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-false}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      - OLLAMA_TIMEOUT_MS=${OLLAMA_TIMEOUT_MS:-60000}
      - AI_SERVICE_URL=http://localhost:8000
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DISPATCH_MODE=${DISPATCH_MODE:-push}
      - RUNNER_API_KEY=${RUNNER_API_KEY:-}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
      - JAVA_RUNNER_URL=${JAVA_RUNNER_URL:-http://java-runner:8080}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mcp-server:
    build:
      context: services/mcp-server
      dockerfile: Dockerfile
    container_name: mcp-server
    ports:
      - "8001:8001"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8001
      - MCP_AUTH_REQUIRED=${MCP_AUTH_REQUIRED:-true}
      - MCP_DEBUG=${MCP_DEBUG:-false}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - MCP_API_KEY=${MCP_API_KEY}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - UNIFIED_API_URL=${UNIFIED_API_URL:-http://unified-api:8000}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DATABASE_OPTIONAL=${DATABASE_OPTIONAL:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8001)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  java-runner:
    build:
      context: services/java-runner
      dockerfile: Dockerfile
    container_name: java-runner
    ports:
      - "8080:8080"
    environment:
      - API_BASE_URL=http://unified-api:8000
      - SELENIUM_HEADLESS=true
      - DISPLAY=:99
    restart: unless-stopped
    depends_on:
      unified-api:
        condition: service_healthy
    volumes:
      - ./services/java-runner/screenshots:/app/screenshots
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  react-frontend:
    build:
      context: services/react-frontend
      dockerfile: Dockerfile
      args:
        - VITE_UNIFIED_API_URL=${VITE_UNIFIED_API_URL}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_SQL_API_URL=${VITE_SQL_API_URL}
        - VITE_AI_API_URL=${VITE_AI_API_URL}
        - VITE_HEALING_API_URL=${VITE_HEALING_API_URL}
        - VITE_POLICY_API_URL=${VITE_POLICY_API_URL}
        - VITE_MCP_SERVER_URL=${VITE_MCP_SERVER_URL}
        - VITE_MCP_AUTH_TOKEN=${VITE_MCP_AUTH_TOKEN:-}
    container_name: react-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL}
      - REACT_APP_MCP_SERVER_URL=${REACT_APP_MCP_SERVER_URL}
      - FRONTEND_DOMAIN=${FRONTEND_DOMAIN}
    restart: unless-stopped
    depends_on:
      unified-api:
        condition: service_healthy
      mcp-server:
        condition: service_healthy

volumes:
  # No local database volume needed since using AWS RDS