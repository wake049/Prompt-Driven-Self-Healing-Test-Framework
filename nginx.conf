server {
  listen 80;
  server_name _;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Serve built React
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # API proxy
  location /api/ {
    proxy_pass http://unified-api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 300s; proxy_send_timeout 300s; proxy_read_timeout 300s;
  }

  # MCP WebSocket
  location /mcp/ {
    proxy_pass http://mcp-server:8001/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 7d; proxy_send_timeout 7d; proxy_read_timeout 7d;
  }

  # Runner
  location /runner/ {
    proxy_pass http://java-runner:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 600s; proxy_send_timeout 600s; proxy_read_timeout 600s;
  }

  # Health
  location /health { access_log off; return 200 "healthy\n"; add_header Content-Type text/plain; }

  # Gzip and static cache
  gzip on; gzip_vary on; gzip_min_length 1024; gzip_proxied any; gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ { expires 1y; add_header Cache-Control "public, immutable"; }

  # Block sensitive
  location ~ /\. { deny all; access_log off; log_not_found off; }
  location ~ \.(env|config|sql|log)$ { deny all; access_log off; log_not_found off; }
}
